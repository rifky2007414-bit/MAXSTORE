<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body data-maxstore-api="https://script.google.com/macros/s/AKfycbwMEE1jLlrnOaXJwegHZ4uT0IUghAR4qzuVDYOhStP97UiyCfBQ7HRkxQKItadvgnP99Q/exec"><div class="wrap"><div class="glass card"><h1>Cart</h1><div id="c"></div></div></div><script src="app.js"></script><script>(async()=>{const s=requireLogin();if(!s)return;const r=await apiGet("cart",{userId:s.userId});const a=r.cart||[];c.innerHTML=a.length?'<table class="table"><tr><th>Product</th><th>Qty</th><th>Price</th></tr>'+a.map(x=>`<tr><td>${esc(x.ProductName||x.ProductID)}</td><td>${esc(x.Quantity)}</td><td>${money(x.Price)}</td></tr>`).join("")+'</table><br><a class="btn primary" href="checkout.html">Checkout</a>':'<div class="empty">Cart is empty.</div>'})();</script></body></html>
