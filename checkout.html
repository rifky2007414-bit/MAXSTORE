<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="glass form"><h1>Checkout</h1><div class="field"><label>Address</label><textarea id="address"></textarea></div><div class="field"><label>Payment</label><select id="pay"><option>COD</option><option>Bank Transfer</option><option>Online</option></select></div><button class="btn primary" onclick="place()">Place Order</button><div id="m"></div></div></div><script src="app.js"></script><script>async function place(){const s=requireLogin();if(!s)return;const r=await apiPost({action:"createOrder",userId:s.userId,paymentMethod:pay.value,shippingAddress:address.value});m.innerHTML='<div class="notice '+(r.success?'ok':'err')+'">'+esc(r.message||"")+'</div>'}</script></body></html>
