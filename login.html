<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head>
<body data-maxstore-api="https://script.google.com/macros/s/AKfycbwMEE1jLlrnOaXJwegHZ4uT0IUghAR4qzuVDYOhStP97UiyCfBQ7HRkxQKItadvgnP99Q/exec">
<div class="wrap"><div class="glass form"><div class="logo">MAX<span>STORE</span></div><h1>Login</h1><div id="m"></div>
<div class="field"><label>Login as</label><div style="display:flex;gap:10px;flex-wrap:wrap">
<label class="role-choice"><input type="radio" name="role" value="buyer" checked> Buyer</label>
<label class="role-choice"><input type="radio" name="role" value="seller"> Seller</label></div></div>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn primary" onclick="login()">Login</button>
<p class="muted">Don't have an account? <a href="register.html">Create account</a></p>
</div></div>
<script src="app.js"></script><script>
async function login(){
 const selected=document.querySelector('input[name="role"]:checked').value;
 const r=await apiPost({action:"login",email:email.value,password:password.value});
 m.innerHTML='<div class="notice '+(r.success?'ok':'err')+'">'+esc(r.message||"Login failed")+'</div>';
 if(r.success){
   if(selected!=="admin" && r.user.role!==selected){
     m.innerHTML='<div class="notice err">This account is registered as '+esc(r.user.role)+'. Please select the correct login type.</div>'; return;
   }
   localStorage.setItem("maxstoreSession",JSON.stringify(r.user));
   location.href=r.user.role==="seller"?"seller dashboard.html":"index.html";
 }
}
</script></body></html>
