<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body data-maxstore-api="https://script.google.com/macros/s/AKfycbwMEE1jLlrnOaXJwegHZ4uT0IUghAR4qzuVDYOhStP97UiyCfBQ7HRkxQKItadvgnP99Q/exec"><div class="wrap"><div class="glass card"><h1>My Orders</h1><div id="o"></div></div></div><script src="app.js"></script><script>(async()=>{const s=requireLogin();if(!s)return;const r=await apiGet("orders",{userId:s.userId});const a=r.orders||[];o.innerHTML=a.length?'<table class="table"><tr><th>ID</th><th>Amount</th><th>Status</th></tr>'+a.map(x=>`<tr><td>${esc(x.OrderID)}</td><td>${money(x.TotalAmount||x.Total)}</td><td>${esc(x.OrderStatus||x.Status)}</td></tr>`).join("")+'</table>':'<div class="empty">No orders.</div>'})();</script></body></html>
