<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body data-maxstore-api="https://script.google.com/macros/s/AKfycbwMEE1jLlrnOaXJwegHZ4uT0IUghAR4qzuVDYOhStP97UiyCfBQ7HRkxQKItadvgnP99Q/exec"><div class="wrap"><nav class="nav glass"><div class="logo">MAX<span>STORE</span></div><a class="btn" href="products.html">← Products</a></nav><div id="v" class="glass card"></div></div><script src="app.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get("id");const r=await apiGet("products");const p=(r.products||[]).find(x=>String(x.ProductID)===String(id));if(!p)return document.getElementById("v").innerHTML='<div class="empty">Product not found.</div>';document.getElementById("v").innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:25px"><img style="width:100%;border-radius:15px" src="${esc(p.ImageURL||'https://via.placeholder.com/700?text=MAXSTORE')}"><div><h1>${esc(p.ProductName)}</h1><div class="price">${money(p.Price)}</div><p class="muted">${esc(p.Description||"")}</p><p>Stock: ${esc(p.Stock||0)}</p><button class="btn primary" onclick="add()">Add to Cart</button></div></div>`;window.add=async()=>{const s=requireLogin();if(!s)return;const z=await apiPost({action:"addCart",userId:s.userId,productId:p.ProductID,quantity:1});alert(z.message||"Added")}})();</script></body></html>
