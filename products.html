<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body data-maxstore-api="https://script.google.com/macros/s/AKfycbwMEE1jLlrnOaXJwegHZ4uT0IUghAR4qzuVDYOhStP97UiyCfBQ7HRkxQKItadvgnP99Q/exec"><div class="wrap"><nav class="nav glass"><div class="logo">MAX<span>STORE</span></div><a class="btn" href="index.html">Home</a></nav><div class="glass card"><input id="q" style="width:100%;padding:12px;border-radius:10px;background:#0c0e14;color:#fff;border:1px solid #333" placeholder="Search..." oninput="render()"></div><br><div id="p" class="products"></div></div><script src="app.js"></script><script>let all=[];async function load(){const r=await apiGet("products");all=r.products||[];render()}function render(){const q=document.getElementById("q").value.toLowerCase();const a=all.filter(x=>String(x.ProductName||"").toLowerCase().includes(q)||String(x.MainCategory||"").toLowerCase().includes(q));document.getElementById("p").innerHTML=a.map(x=>`<article class="product glass"><img src="${esc(x.ImageURL||'https://via.placeholder.com/600?text=MAXSTORE')}"><div class="body"><b>${esc(x.ProductName)}</b><div class="price">${money(x.Price)}</div><a class="btn primary" href="product.html?id=${encodeURIComponent(x.ProductID)}">View</a></div></article>`).join("")||'<div class="empty">No products found.</div>'}load();</script></body></html>
