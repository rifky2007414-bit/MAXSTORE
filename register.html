<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="glass form"><div class="logo">MAX<span>STORE</span></div><h1>Register</h1><div id="m"></div><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="reg()">Create Account</button></div></div><script src="app.js"></script><script>async function reg(){const r=await apiPost({action:"register",name:name.value,email:email.value,phone:phone.value,password:password.value});m.innerHTML='<div class="notice '+(r.success?'ok':'err')+'">'+esc(r.message||"")+'</div>';if(r.success)setTimeout(()=>location.href="login.html",700)}</script></body></html>
