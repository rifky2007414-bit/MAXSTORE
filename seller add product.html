<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="glass form"><div class="logo">MAX<span>STORE</span></div><h1 id="title">Add Product</h1><div id="m"></div><div class="field"><label>Name</label><input id="n"></div><div class="field"><label>Category</label><input id="cat"></div><div class="field"><label>Price</label><input id="price" type="number"></div><div class="field"><label>Stock</label><input id="stock" type="number"></div><div class="field"><label>Image URL</label><input id="img"></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><button class="btn primary" onclick="save()">Save</button></div></div><script src="app.js"></script><script>let seller,id=new URLSearchParams(location.search).get("id");(async()=>{const s=requireLogin("seller");if(!s)return;const sr=await apiGet("sellers");seller=(sr.sellers||[]).find(x=>String(x.UserID)===String(s.userId));if(id){const r=await apiGet("products");const x=(r.products||[]).find(z=>String(z.ProductID)===String(id)&&String(z.SellerID)===String(seller.SellerID));if(x){title.textContent="Edit Product";n.value=x.ProductName||"";cat.value=x.MainCategory||"";price.value=x.Price||"";stock.value=x.Stock||"";img.value=x.ImageURL||"";desc.value=x.Description||""}}})();async function save(){const r=await apiPost({action:id?"updateProduct":"addProduct",productID:id,sellerID:seller.SellerID,ProductName:n.value,MainCategory:cat.value,Price:price.value,Stock:stock.value,ImageURL:img.value,Description:desc.value,Status:"Active"});m.innerHTML='<div class="notice '+(r.success?'ok':'err')+'">'+esc(r.message||"Saved")+'</div>';if(r.success)setTimeout(()=>location.href="seller products.html",600)}</script></body></html>
