<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body data-maxstore-api="https://script.google.com/macros/s/AKfycbwMEE1jLlrnOaXJwegHZ4uT0IUghAR4qzuVDYOhStP97UiyCfBQ7HRkxQKItadvgnP99Q/exec"><div class="wrap"><nav class="nav glass"><div class="logo">MAX<span>STORE</span></div><div class="links"><a href="seller dashboard.html">Dashboard</a><a href="seller products.html">Products</a><a href="seller add product.html">Add Product</a><a href="seller orders.html">Orders</a><a href="seller earnings.html">Earnings</a><a href="seller withdraw.html">Withdraw</a></div><button class="btn" onclick="logout()">Logout</button></nav><h1>Seller Dashboard</h1><p id="name" class="muted"></p><div class="grid" style="margin:20px 0"><div class="glass card">Products<div id="p" class="stat">0</div></div><div class="glass card">Orders<div id="o" class="stat">0</div></div><div class="glass card">Sales<div id="s" class="stat">LKR 0</div></div><div class="glass card">Commission<div id="c" class="stat">LKR 0</div></div></div></div><script src="app.js"></script><script>(async()=>{const s=requireLogin("seller");if(!s)return;const sr=await apiGet("sellers");const v=(sr.sellers||[]).find(x=>String(x.UserID)===String(s.userId));if(!v)return;name.textContent=v.StoreName||v.OwnerName||s.email;const pr=await apiGet("products");p.textContent=(pr.products||[]).filter(x=>String(x.SellerID)===String(v.SellerID)).length;const or=await apiGet("orders",{sellerId:v.SellerID});const a=or.orders||[];o.textContent=a.length;const sales=a.filter(x=>String(x.OrderStatus||x.Status).toLowerCase()==="delivered").reduce((t,x)=>t+Number(x.TotalAmount||x.Total||0),0);s.textContent=money(sales);c.textContent=money(sales*.1)})();</script></body></html>
