<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earnings | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body data-maxstore-api="https://script.google.com/macros/s/AKfycbwMEE1jLlrnOaXJwegHZ4uT0IUghAR4qzuVDYOhStP97UiyCfBQ7HRkxQKItadvgnP99Q/exec"><div class="wrap"><nav class="nav glass"><div class="logo">MAX<span>STORE</span></div><div class="links"><a href="seller dashboard.html">Dashboard</a><a href="seller products.html">Products</a><a href="seller add product.html">Add Product</a><a href="seller orders.html">Orders</a><a href="seller earnings.html">Earnings</a><a href="seller withdraw.html">Withdraw</a></div><button class="btn" onclick="logout()">Logout</button></nav><h1>Earnings</h1><div class="grid" style="margin-top:20px"><div class="glass card">Sales<div id="sales" class="stat">LKR 0</div></div><div class="glass card">Commission<div id="com" class="stat">LKR 0</div></div><div class="glass card">Net<div id="net" class="stat">LKR 0</div></div><div class="glass card">Available<div id="bal" class="stat">LKR 0</div></div></div></div><script src="app.js"></script><script>(async()=>{const s=requireLogin("seller");if(!s)return;const sr=await apiGet("sellers");const v=(sr.sellers||[]).find(x=>String(x.UserID)===String(s.userId));const r=await apiGet("orders",{sellerId:v.SellerID});const a=(r.orders||[]).filter(x=>String(x.OrderStatus||x.Status).toLowerCase()==="delivered");const sales=a.reduce((t,x)=>t+Number(x.TotalAmount||x.Total||0),0),c=sales*.1;sales.textContent=money(sales);com.textContent=money(c);net.textContent=money(sales-c);try{const b=await apiGet("sellerBalances",{sellerId:v.SellerID});bal.textContent=money(b.balance?.AvailableBalance||sales-c)}catch(e){bal.textContent=money(sales-c)}})();</script></body></html>
