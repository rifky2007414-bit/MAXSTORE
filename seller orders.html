<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Orders | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><nav class="nav glass"><div class="logo">MAX<span>STORE</span></div><div class="links"><a href="seller dashboard.html">Dashboard</a><a href="seller products.html">Products</a><a href="seller add product.html">Add Product</a><a href="seller orders.html">Orders</a><a href="seller earnings.html">Earnings</a><a href="seller withdraw.html">Withdraw</a></div><button class="btn" onclick="logout()">Logout</button></nav><div class="glass card"><h1>Orders</h1><div id="o"></div></div></div><script src="app.js"></script><script>(async()=>{const s=requireLogin("seller");if(!s)return;const sr=await apiGet("sellers");const v=(sr.sellers||[]).find(x=>String(x.UserID)===String(s.userId));const r=await apiGet("orders",{sellerId:v.SellerID});const a=r.orders||[];o.innerHTML=a.length?'<table class="table"><tr><th>Order</th><th>Amount</th><th>Status</th></tr>'+a.map(x=>`<tr><td>${esc(x.OrderID)}</td><td>${money(x.TotalAmount||x.Total)}</td><td>${esc(x.OrderStatus||x.Status)}</td></tr>`).join("")+'</table>':'<div class="empty">No orders.</div>'})();</script></body></html>
