<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Products | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><nav class="nav glass"><div class="logo">MAX<span>STORE</span></div><div class="links"><a href="seller dashboard.html">Dashboard</a><a href="seller products.html">Products</a><a href="seller add product.html">Add Product</a><a href="seller orders.html">Orders</a><a href="seller earnings.html">Earnings</a><a href="seller withdraw.html">Withdraw</a></div><button class="btn" onclick="logout()">Logout</button></nav><div class="actions"><a class="btn primary" href="seller add product.html">+ Add Product</a></div><br><div id="p" class="products"></div></div><script src="app.js"></script><script>let seller,all=[];(async()=>{const s=requireLogin("seller");if(!s)return;const sr=await apiGet("sellers");seller=(sr.sellers||[]).find(x=>String(x.UserID)===String(s.userId));const r=await apiGet("products");all=(r.products||[]).filter(x=>String(x.SellerID)===String(seller.SellerID));render()})();function render(){p.innerHTML=all.map(x=>`<article class="product glass"><img src="${esc(x.ImageURL||'https://via.placeholder.com/600?text=MAXSTORE')}"><div class="body"><b>${esc(x.ProductName)}</b><div class="price">${money(x.Price)}</div><div>Stock: ${esc(x.Stock)}</div><div class="actions"><a class="btn" href="seller add product.html?id=${encodeURIComponent(x.ProductID)}">Edit</a><button class="btn danger" onclick="del('${esc(x.ProductID)}')">Delete</button></div></div></article>`).join("")||'<div class="empty">No products.</div>'}async function del(id){if(!confirm("Delete?"))return;const r=await apiPost({action:"deleteProduct",productID:id,sellerID:seller.SellerID});alert(r.message||"Done");location.reload()}</script></body></html>
