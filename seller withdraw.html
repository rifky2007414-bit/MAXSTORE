<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw | MAXSTORE</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><nav class="nav glass"><div class="logo">MAX<span>STORE</span></div><div class="links"><a href="seller dashboard.html">Dashboard</a><a href="seller products.html">Products</a><a href="seller add product.html">Add Product</a><a href="seller orders.html">Orders</a><a href="seller earnings.html">Earnings</a><a href="seller withdraw.html">Withdraw</a></div><button class="btn" onclick="logout()">Logout</button></nav><div class="glass form"><h1>Withdraw Earnings</h1><div id="bal" class="stat">LKR 0</div><div id="m"></div><div class="field"><label>Amount</label><input id="amt" type="number"></div><div class="field"><label>Method</label><select id="method"><option>Bank Transfer</option><option>Cash</option></select></div><div class="field"><label>Details</label><textarea id="details"></textarea></div><button class="btn primary" onclick="go()">Request Withdrawal</button></div><br><div class="glass card"><h2>History</h2><div id="h" class="empty">Loading...</div></div></div><script src="app.js"></script><script>let seller,balance=0;(async()=>{const s=requireLogin("seller");if(!s)return;const sr=await apiGet("sellers");seller=(sr.sellers||[]).find(x=>String(x.UserID)===String(s.userId));try{const b=await apiGet("sellerBalances",{sellerId:seller.SellerID});balance=Number(b.balance?.AvailableBalance||0)}catch(e){}bal.textContent=money(balance);try{const r=await apiGet("withdrawals",{sellerId:seller.SellerID});const a=r.withdrawals||[];h.innerHTML=a.length?'<table class="table"><tr><th>ID</th><th>Amount</th><th>Status</th></tr>'+a.map(x=>`<tr><td>${esc(x.WithdrawalID||x.ID)}</td><td>${money(x.Amount)}</td><td>${esc(x.Status)}</td></tr>`).join("")+'</table>':'No requests yet.'}catch(e){h.textContent="History API not available."}})();async function go(){const amount=Number(amt.value);if(!amount||amount<=0)return alert("Enter amount");if(balance&&amount>balance)return alert("Amount exceeds balance");const r=await apiPost({action:"withdraw",sellerID:seller.SellerID,sellerId:seller.SellerID,amount,method:method.value,details:details.value,status:"Pending"});m.innerHTML='<div class="notice '+(r.success?'ok':'err')+'">'+esc(r.message||"")+'</div>';if(r.success)setTimeout(()=>location.reload(),700)}</script></body></html>
